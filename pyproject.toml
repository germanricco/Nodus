[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus"
dynamic = ["version"]
description = "Aplicación de escritorio de finanzas personales, local-first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.urls]
Homepage = "https://github.com/germanricco/Nodus"
Releases = "https://github.com/germanricco/Nodus/releases"
Issues = "https://github.com/germanricco/Nodus/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.7"]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.gui-scripts]
nodus = "nodus.app:main"

[tool.setuptools.dynamic]
version = { attr = "nodus.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodus = ["database/migrations/*.sql", "ui/icons/*.svg", "ui/theme/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
