# Builds the Windows installer and publishes it as a GitHub release.
#
# - Pushing a tag like v0.2.0 publishes the release. The tag must be annotated: its
#   message becomes the release notes.
# - Running it by hand (Actions > Release > Run workflow) only builds the installer and
#   attaches it to the run, to try the build without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: python -m pip install -e ".[dev,build]" -c constraints.txt

      - name: Check that the tag matches the version in the code
        if: github.event_name == 'push'
        run: |
          VERSION=$(python -c "import nodus; print(nodus.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match nodus.__version__ (${VERSION})."
            exit 1
          fi

      - name: Tests
        run: python -m pytest

      - name: Install Inno Setup
        run: |
          if ! command -v ISCC >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --yes --no-progress
          fi

      - name: Build
        # Also opens the built program with --smoke-test, and stops if it does not open whole.
        run: python scripts/build.py

      - name: Find the installer
        id: installer
        run: |
          INSTALLER=$(ls dist/Nodus-Setup-*.exe)
          echo "path=${INSTALLER}" >> "$GITHUB_OUTPUT"

      - name: Install it as a user would, and open the installed copy
        shell: pwsh
        timeout-minutes: 5
        env:
          NODUS_DATA_DIR: ${{ runner.temp }}\nodus-data
        run: |
          $app = Join-Path $env:RUNNER_TEMP "Nodus-installed"
          $setup = Start-Process "${{ steps.installer.outputs.path }}" -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$app"
          if ($setup.ExitCode -ne 0) {
            Write-Error "The installer failed with exit code $($setup.ExitCode)."
            exit 1
          }
          $run = Start-Process (Join-Path $app "Nodus.exe") -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content (Join-Path $env:NODUS_DATA_DIR "logs\nodus.log") -ErrorAction Continue
          if ($run.ExitCode -ne 0) {
            Write-Error "The installed Nodus did not open whole (exit code $($run.ExitCode))."
            exit 1
          }

      - name: Attach the installer to the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          # Uploads the .exe as is instead of inside a zip.
          archive: false

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout may hold a lightweight copy of the tag; fetch the annotated one.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag --list --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" "${{ steps.installer.outputs.path }}" \
            --title "Nodus ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
