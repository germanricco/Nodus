# Lint and tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          # Linux runs 3.12: PySide6 6.12.0 for Linux miscounts None on Python 3.11,
          # which aborts the interpreter after enough Qt calls.
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Qt libraries
        if: runner.os == 'Linux'
        # What Qt needs to draw without a screen (offscreen) on a bare runner.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        # The exact versions of constraints.txt, the same the installer is built with.
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest --cov=nodus --cov-report=term

      - name: Coverage
        if: always()
        shell: bash
        # The table of each module, on the run's page.
        run: python -m coverage report --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"
