# Lint and tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        # The exact versions of constraints.txt, the same the installer is built with.
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest --cov=nodus --cov-report=term

      - name: Coverage
        if: always()
        shell: bash
        # The table of each module, on the run's page.
        run: python -m coverage report --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"
